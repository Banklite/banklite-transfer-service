name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compila el codigo
        run: python -m compileall -q app
      - name: La aplicacion importa correctamente
        run: python -c "import app.main"
        env:
          DATABASE_URL: postgresql+psycopg2://u:p@localhost:5432/db
      - name: La imagen Docker construye
        run: docker build -t banklite-transfer-service .
